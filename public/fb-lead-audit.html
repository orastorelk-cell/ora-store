<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-RA Facebook Order Audit</title><style>body{margin:0;background:#090909;color:#fff;font:15px system-ui,sans-serif}.wrap{max-width:850px;margin:30px auto;padding:22px}.card{padding:24px;border:1px solid #333;border-radius:18px;background:#151515}p{color:#bbb;line-height:1.6}button,a{display:inline-block;margin:8px 10px 16px 0;color:inherit}button{background:#34d399;border:0;border-radius:10px;padding:14px;font-weight:bold;color:#052e20;cursor:pointer}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;min-height:320px;background:#090909;color:#ddd;border:1px solid #444;border-radius:10px;padding:14px;font:12px monospace}#status{white-space:pre-wrap;line-height:1.7}</style></head><body><main class="wrap"><div class="card"><h1>Facebook Order Audit</h1><p>Compare today's Facebook leads with saved O-RA orders and Google Sheet rows. Sign in as Super Admin first. Keep this page open until the check finishes, then copy the final report.</p><a href="/system">Open O-RA System</a><button id="run">Check today's Facebook orders</button><button id="copy" disabled>Copy final report</button><div id="status" role="status" aria-live="polite">Ready to check.</div><textarea id="report" readonly aria-label="Audit result"></textarea></div></main><script>
(()=>{
const status=document.getElementById('status'),report=document.getElementById('report'),button=document.getElementById('run'),copy=document.getElementById('copy');
let progress='',retryNote='',started=0;
const showProgress=()=>{status.textContent=progress+'\nRunning — please wait for the final report. '+Math.floor((Date.now()-started)/1000)+' seconds elapsed.'+(retryNote?'\n'+retryNote:'');};
const api=async(body)=>{
  for(let attempt=0;attempt<3;attempt++){
    const token=localStorage.getItem('ora_staff_session_token')||'';
    if(!token)throw new Error('Sign in as Super Admin at /system first.');
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
    try{
      const r=await fetch('/api/admin/facebook-leads/audit',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(body),cache:'no-store',signal:controller.signal});
      const d=await r.json().catch(()=>null);
      if(!r.ok||!d){const error=new Error(d?.error||'Audit request failed (HTTP '+r.status+').');error.retryable=[429,502,503,504].includes(r.status)||!d;throw error;}
      retryNote='';return d;
    }catch(error){
      if(error.retryable===false||attempt===2)throw error;
      retryNote='Temporary request failure. Retrying '+(attempt+2)+' / 3…';showProgress();
    }finally{clearTimeout(timer);}
    await new Promise(resolve=>setTimeout(resolve,800*(attempt+1)));
  }
};
copy.onclick=async()=>{
  if(copy.disabled)return;
  try{await navigator.clipboard.writeText(report.value);copy.textContent='Report copied';}
  catch{report.focus();report.select();copy.textContent='Report selected — copy the text';}
};
button.onclick=async()=>{
  button.disabled=true;copy.disabled=true;copy.textContent='Copy final report';report.value='';started=Date.now();retryNote='';
  const now=new Date(),localDate=new Date(now.getTime()+330*60000).toISOString().slice(0,10);
  const window={since:new Date(localDate+'T00:00:00+05:30').toISOString(),until:now.toISOString()};
  const result={...window,checked_at:null,status:'running',phase:'facebook',complete:false,total_forms:0,forms_checked:0,sheet_orders_checked:0,leads:[],sheet:[],errors:[]};
  const save=()=>{report.value=JSON.stringify(result,null,2);};
  progress='Checking Facebook forms: 0 / …';showProgress();save();
  const heartbeat=setInterval(showProgress,1000);
  try{
    let offset=0,form_list='';const leads=new Map();
    while(true){
      progress='Checking Facebook forms: '+offset+' / '+(result.total_forms||'…');showProgress();
      const d=await api({...window,offset,form_list});
      if(d.ok!==true||!Number.isInteger(d.total_forms)||d.total_forms<0||!Number.isInteger(d.next_offset)||d.next_offset<offset||d.next_offset>d.total_forms||d.forms_checked!==d.next_offset-offset||(!d.done&&d.next_offset===offset)||d.done!==(d.next_offset===d.total_forms)||typeof d.form_list!=='string'||!Array.isArray(d.leads)||!Array.isArray(d.errors)||(form_list&&(d.form_list!==form_list||d.total_forms!==result.total_forms)))throw new Error('Facebook audit progress could not be verified. Restart the audit.');
      result.total_forms=d.total_forms;form_list=d.form_list;result.errors.push(...d.errors);
      d.leads.forEach(lead=>leads.set(lead.lead_id,lead));offset=d.next_offset;
      result.forms_checked=offset;result.leads=Array.from(leads.values());save();
      if(d.done)break;
    }
    result.phase='sheet';save();
    const numbers=Array.from(new Set(result.leads.map(lead=>lead.order_number).filter(Boolean)));
    for(let offset=0;offset<numbers.length;offset+=5){
      progress='Facebook forms checked: '+result.forms_checked+' / '+result.total_forms+'\nChecking Google Sheet orders: '+offset+' / '+numbers.length;showProgress();
      const selected=numbers.slice(offset,offset+5),d=await api({...window,action:'sheet',order_numbers:selected});
      if(d.ok!==true||!Array.isArray(d.results)||d.results.length!==selected.length||new Set(d.results.map(row=>row.order_number)).size!==selected.length||d.results.some(row=>!selected.includes(row.order_number)||(!row.error&&(typeof row.found!=='boolean'||!Number.isInteger(row.rows)||row.rows<0||!Number.isInteger(row.expected_rows)||row.expected_rows<1))))throw new Error('Google Sheet audit response was incomplete. Retry the audit.');
      result.sheet.push(...d.results);result.sheet_orders_checked=result.sheet.length;save();
    }
    const missing=result.leads.filter(lead=>!lead.order_number),sheetMissing=result.sheet.filter(row=>!row.error&&(!row.found||row.rows<row.expected_rows));
    result.complete=result.forms_checked===result.total_forms&&result.sheet.length===numbers.length&&result.errors.length===0&&result.sheet.every(row=>!row.error);
    result.status=result.complete?'complete':'incomplete';result.phase='finished';result.checked_at=new Date().toISOString();
    result.summary={facebook_leads:result.leads.length,system_matched:result.leads.length-missing.length,missing_in_system:missing.length,missing_or_partial_in_sheet:sheetMissing.length};
    status.textContent=(result.complete?'Audit complete.':'Audit incomplete — some source data could not be verified.')+'\nFacebook forms checked: '+result.forms_checked+' / '+result.total_forms+'\nFacebook leads: '+result.leads.length+'\nMatched in O-RA: '+result.summary.system_matched+'\nMissing in O-RA: '+missing.length+'\nMissing / partial Sheet orders: '+sheetMissing.length+'\nCopy the final report below.';
    save();
  }catch(error){result.status='incomplete';result.checked_at=new Date().toISOString();result.errors.push(error.message||String(error));status.textContent='Audit incomplete: '+(error.message||String(error))+'\nFacebook forms checked: '+result.forms_checked+' / '+result.total_forms+'\nCopy this report so the failed check can be investigated.';save();}
  finally{clearInterval(heartbeat);button.disabled=false;copy.disabled=false;}
};
})();
</script></body></html>
