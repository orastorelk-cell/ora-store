<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-RA Cancel Before Dispatch</title>
<style>body{font:16px Arial,sans-serif;background:#0b1020;color:#eef3ff;max-width:820px;margin:32px auto;padding:20px}main{background:#151c30;border:1px solid #34425f;border-radius:20px;padding:26px}h1{font-size:24px}p{line-height:1.6;color:#ced7e9}label{display:block;margin:18px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #536384;border-radius:8px;background:#0b1020;color:white;font:inherit}button{margin:18px 8px 0 0;padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer;background:#a7dfb7;color:#071d0e}button:disabled{opacity:.4;cursor:default}#cancel{background:#ffc28d;color:#321504}a{color:#a8cfff}pre{padding:18px;background:#0b1020;border-radius:10px;white-space:pre-wrap;line-height:1.55;font-size:14px}#status{font-weight:bold;color:#f5dca0}.success{color:#9deeb5!important}</style></head>
<body><main><h1>Cancel Before Dispatch</h1><p>Super Admin: cancel an unsent order, restore its allocated items once, and keep its invoice and waybill history. A removed courier waybill stays permanently locked to this order.</p>
<p><a href="/system">O-RA System</a> must be signed in in this browser.</p>
<label for="waybill">Waybill number</label><input id="waybill" inputmode="numeric" autocomplete="off">
<button id="check">Check Order</button>
<label for="reason">Cancellation reason</label><textarea id="reason" rows="2">Parcel will not be sent; waybill removed from courier.</textarea>
<button id="cancel" disabled>Cancel Order • Restore Stock • Keep Waybill</button>
<p id="status" role="status">Check the exact waybill first.</p><pre id="report"></pre></main>
<script>
let checked=null;
const waybill=document.getElementById('waybill'),reason=document.getElementById('reason'),check=document.getElementById('check'),cancel=document.getElementById('cancel'),status=document.getElementById('status'),report=document.getElementById('report');
async function request(options){const token=localStorage.getItem('ora_staff_session_token')||'';if(!token)throw new Error('Sign in to O-RA System as Super Admin first.');const r=await fetch('/api/orders/cancel-before-dispatch'+(options?'':'?waybill='+encodeURIComponent(waybill.value.trim())),{...options,headers:{authorization:'Bearer '+token,'content-type':'application/json'},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'The request did not finish. Retry the same order.');return data;}
function show(data){checked=data;status.className=data.complete?'success':'';status.textContent=data.complete?'CANCELLED • Stock restoration saved • Waybill permanently locked':data.cancellation_state==='pending'?'Cancellation pending. Retry to finish restoring stock.':'Order checked. Review before cancelling.';
const lines=['Order: '+data.order_number,'Status: '+data.order_status,'Waybill: '+data.waybill_number,'Waybill status: '+(data.waybill_status||'No registry record'),'Waybill owner: '+(data.waybill_owner||'None'),'Waybill permanently retired: '+(data.waybill_retired?'YES':'NO'),'Original invoice: '+(data.invoice_number||'Not generated'),'Stock allocated: '+(data.allocated_stock?'YES':'NO'),''];
for(const item of data.items||[])lines.push(item.sku+' • '+item.item+' • Qty '+item.quantity+' • Current stock '+item.current_stock);
if(data.stock_restored?.length){lines.push('','STOCK RESTORED ONCE');for(const item of data.stock_restored)lines.push(item.sku+' • +'+item.quantity+' • '+item.previous_stock+' → '+item.new_stock);}
lines.push('','Restoration: '+(data.cancellation_state||'Not started'),'Storage: '+data.storage,'Checked: '+data.checked_at);report.textContent=lines.join('\n');cancel.disabled=data.complete||!data.can_cancel;}
async function run(action){check.disabled=true;cancel.disabled=true;try{await action();}catch(e){status.className='';status.textContent=e.message||String(e);cancel.disabled=!checked||checked.complete||!checked.can_cancel;}finally{check.disabled=false;}}
waybill.oninput=()=>{checked=null;cancel.disabled=true;};check.onclick=()=>run(async()=>show(await request()));
cancel.onclick=()=>run(async()=>{if(!checked||waybill.value.trim()!==checked.waybill_number)throw new Error('Check this waybill again.');const clean=reason.value.trim();if(!clean)throw new Error('Enter a cancellation reason.');if(!confirm('Cancel '+checked.order_number+'?\n\nRestore only its allocated stock.\nKeep waybill '+checked.waybill_number+' permanently locked.\nOriginal invoice and history stay with this order.')){cancel.disabled=false;return;}status.textContent='Saving cancellation and stock restoration…';show(await request({method:'POST',body:JSON.stringify({order_id:checked.order_id,waybill_number:checked.waybill_number,reason:clean})}));});
const initialWaybill=new URLSearchParams(location.hash.slice(1)).get('waybill');if(initialWaybill){waybill.value=initialWaybill;history.replaceState(null,'',location.pathname);run(async()=>show(await request()));}
</script></body></html>
