<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-RA Order Readiness</title>
<style>body{font:15px system-ui,sans-serif;background:#0b1020;color:#e5edf9;max-width:1100px;margin:32px auto;padding:20px}section{border:1px solid #334155;background:#151c30;border-radius:14px;padding:20px;margin:18px 0}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;background:#0b1020;color:white;border:1px solid #64748b;border-radius:8px}button,a{color:inherit}button{padding:12px 18px;margin:8px 8px 8px 0;border:1px solid #64748b;background:#1e3a5f;color:white;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #334155}pre{white-space:pre-wrap;overflow-wrap:anywhere}.good{color:#86efac}.wait{color:#fcd34d}</style></head>
<body><h1>O-RA Order Readiness</h1><a href="/system">Open O-RA System</a><section><label for="orders">Order numbers</label><input id="orders" placeholder="FB-000431, FB-000435" autocomplete="off"><button id="check">Check saved orders</button><button id="retry">Retry ready invoices</button><button id="website">Verify website save</button><p>Retry uses the shared available waybill pool and saves only missing invoices. Existing invoices and allocated stock are preserved.</p><p id="summary">Sign in to O-RA System in this browser first.</p><table><thead><tr><th>Order</th><th>Status</th><th>Waybill</th><th>Invoice</th><th>Packing batch</th></tr></thead><tbody id="rows"></tbody></table><pre id="result" role="status"></pre></section>
<script>
const $=id=>document.getElementById(id);let current=null;
async function request(path,options={}){const token=localStorage.getItem('ora_staff_session_token')||'';if(!token)throw Error('Sign in to O-RA System in this browser first.');const response=await fetch(path,{...options,cache:'no-store',headers:{'content-type':'application/json',authorization:'Bearer '+token}});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Request '+response.status+': '+raw.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,500))}if(!response.ok)throw Error(data.error||'Request failed ('+response.status+')');return data;}
async function check(){current=await request('/api/orders/fulfilment-status?orders='+encodeURIComponent($('orders').value));$('summary').textContent='Saved orders checked. Shared waybill pool: '+current.pool.available+' available / '+current.pool.total+' total. Website version: '+current.website.version+'.';$('rows').replaceChildren();for(const order of current.orders){const tr=document.createElement('tr');for(const value of [order.order_number,order.reason,order.waybill_number||'—',order.invoice_number||'—',order.packing_batch||'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}tr.className=order.invoice_saved?'good':'wait';$('rows').append(tr)}return current;}
async function run(action){for(const button of document.querySelectorAll('button'))button.disabled=true;$('result').textContent='Checking…';try{await action()}catch(error){$('result').textContent=error.message}finally{for(const button of document.querySelectorAll('button'))button.disabled=false}}
$('check').onclick=()=>run(async()=>{await check();$('result').textContent='Verified from the server.'});
$('retry').onclick=()=>run(async()=>{await check();const candidates=current.orders.filter(o=>o.stock_allocated&&o.call_center_status==='Confirmed'&&o.order_status!=='Cancelled'&&!o.invoice_saved);const errors=[],ids=[];for(const candidate of candidates){try{if(!candidate.waybill_number)await request('/api/orders/waybill/assign',{method:'POST',body:JSON.stringify({order_id:candidate.id})});ids.push(candidate.id)}catch(error){errors.push(candidate.order_number+': '+error.message)}}if(ids.length){const data=await request('/api/orders/invoices/ensure',{method:'POST',body:JSON.stringify({order_ids:ids,batch_id:'PACK-RECOVERY-'+Date.now(),automatic:true})});for(const r of data.results)if(r.status==='failed')errors.push(r.order_number+': '+r.error)}await check();$('result').textContent=errors.length?errors.join('\n'):'Ready invoices safely saved.'});
$('website').onclick=()=>run(async()=>{const before=await request('/api/admin/storefront/state');if(!before.state)throw Error('No saved website found.');const state=before.state;const saved=await request('/api/admin/storefront/state',{method:'PUT',body:JSON.stringify({products:state.products,categories:state.categories,settings:state.settings,expected_version:state.version})});await check();$('result').textContent='Website save verified: '+(saved.unchanged?'existing saved version acknowledged':'saved')+'. Version '+saved.version+'.'});
const query=new URLSearchParams(location.search);$('orders').value=query.get('orders')||'';
</script></body></html>
